server:
  port: ${BLOG_BACKEND_PORT}

spring:
  application:
    name: blog-backend
  config:
    import:
      - "optional:configserver:"
  cloud:
    config:
      uri: ${CONFIG_SERVER_URL}
      username: ${CONFIG_SERVER_USERNAME}
      password: ${CONFIG_SERVER_PASSWORD}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

jwt:
  secret: ${JWT_SECRET}
  expiration-in-seconds: ${JWT_EXPIRATION}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    filter: true